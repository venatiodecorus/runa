<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runa</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2312756b'/%3E%3Cg stroke='%23fff' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'%3E%3Cpath d='M8.5 4v16'/%3E%3Cpath d='M8.5 4l7 4.5-7 4.5'/%3E%3Cpath d='M10.5 11.6l5.5 8.4'/%3E%3C/g%3E%3C/svg%3E"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14171c" />
    <script>
      // Apply the stored theme before first paint (see src/ui/themeMode.ts).
      try {
        var t = localStorage.getItem("runa.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
